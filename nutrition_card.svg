
    <svg width="790" height="260" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
        <rect width="840" height="260" rx="14" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
        
        <!-- HEADER -->
        <rect x="0" y="0" width="840" height="42" rx="14" fill="#1565c0"/>
        <rect x="0" y="20" width="840" height="22" fill="#1565c0"/>
        <text x="20" y="26" fill="#ffffff" font-size="14" font-weight="bold">REPÈRE NUTRITIONNEL : TRAJNO MLIJEKO</text>
        
        <!-- SEPARATEURS VERTICAUX -->
        <line x1="200" y1="60" x2="200" y2="240" stroke="#eeeeee" stroke-width="2"/>
        <line x1="560" y1="60" x2="560" y2="240" stroke="#eeeeee" stroke-width="2"/>
        
        <!-- BLOC 1 : Portion & Kcal -->
        <text x="100" y="75" font-size="14" fill="#616161" font-weight="bold" text-anchor="middle">Portion</text>
        <text x="100" y="95" font-size="16" fill="#333" text-anchor="middle">1000 g</text>
        
        <circle cx="100" cy="160" r="46" fill="#e8f5e9" stroke="#43A047" stroke-width="3"/>
        <text x="100" y="160" font-size="26" font-weight="800" fill="#2e7d32" text-anchor="middle">564</text>
        <text x="100" y="182" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">kcal</text>

        <!-- BLOC 2 : Jauge Macros -->
        <text x="220" y="75" font-size="14" fill="#616161" font-weight="bold">Répartition énergétique</text>
        
        <!-- ClipPath pour arrondir toute la jauge -->
        <defs>
            <clipPath id="barClip">
                <rect x="0" y="0" width="320" height="28" rx="6" ry="6"/>
            </clipPath>
        </defs>
        
        <g transform="translate(220, 127)" clip-path="url(#barClip)">
            <!-- Fond gris clair si 0 kcal -->
            <rect x="0" y="0" width="320" height="28" fill="#f5f5f5"/>
            
            <!-- Glucides + Sucres -->
            <rect x="0" y="0" width="102.1" height="28" fill="#42a5f5"/>
            <rect x="0.0" y="14" width="102.1" height="14" fill="#1565c0"/>
            
            <!-- Protéines -->
            <rect x="102.1" y="0" width="74.9" height="28" fill="#66bb6a"/>
            
            <!-- Lipides + Saturés (Hachure simulée par couleur sombre alignée à droite de sa section) -->
            <rect x="177.0" y="0" width="143.0" height="28" fill="#ffa726"/>
            <rect x="228.1" y="14" width="91.9" height="14" fill="#e65100"/>

            <!-- Bordure optionnelle pour délimiter nettement l'extrémité droite -->
            <rect x="0" y="0" width="320" height="28" rx="6" ry="6" fill="none" stroke="#ccc" stroke-width="1"/>
        </g>
        
        <!-- Textes sous jauge -->
        <text x="220" y="100" font-size="13" font-weight="bold" fill="#42a5f5">■ Glucides</text>
        <text x="220" y="117" font-size="13" fill="#333">45.0 g</text>
        <text x="220" y="170" font-size="11" font-weight="bold" fill="#1565c0">dont sucres : 45.0 g</text>
        
        <text x="330" y="100" font-size="13" font-weight="bold" fill="#2e7d32">■ Protéines</text>
        <text x="330" y="117" font-size="13" fill="#333">33.0 g</text>
        
        <text x="440" y="100" font-size="13" font-weight="bold" fill="#ffa726">■ Lipides</text>
        <text x="440" y="117" font-size="13" fill="#333">28.0 g</text>
        <text x="440" y="170" font-size="11" font-weight="bold" fill="#e65100">dont saturés : 18.0 g</text>

        <!-- BLOC 3 : Badges -->
        <text x="580" y="75" font-size="14" fill="#616161" font-weight="bold">Indicateurs</text>
        
        <rect x="580" y="95" width="180" height="28" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
        <text x="670" y="114" font-size="12" font-weight="bold" fill="#1565c0" text-anchor="middle">🦴 Source de Calcium</text>
        
        <rect x="580" y="129" width="180" height="28" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
        <text x="670" y="148" font-size="12" font-weight="bold" fill="#c62828" text-anchor="middle">⚠️ Fort en sel</text>
        
    </svg>