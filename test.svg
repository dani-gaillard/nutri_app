<svg width="440" height="255" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
    <rect width="440" height="255" rx="14" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
    
    <!-- En-tête -->
    <rect x="0" y="0" width="440" height="42" rx="14" fill="#1565c0"/>
    <text x="20" y="26" fill="#ffffff" font-size="14" font-weight="bold">Moutarde mi-forte</text>
    <text x="420" y="26" fill="#bbdefb" font-size="12" text-anchor="end">Portion : 100g</text>

    <!-- Calories -->
    <text x="20" y="72" font-size="13" fill="#616161">Énergie apportée</text>
    <text x="20" y="98" font-size="24" font-weight="800" fill="#2e7d32">245 <tspan font-size="14" font-weight="normal">kcal</tspan></text>

    <!-- Jauge tripartite -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="16.8" height="22" fill="#0288d1" rx="3"/>
      <rect x="16.8" y="0" width="27.4" height="22" fill="#43a047" rx="3"/>
      <rect x="44.2" y="0" width="335.8" height="22" fill="#fbc02d" rx="3"/>
    </g>

    <!-- Détail Macros -->
    <text x="20" y="155" font-size="11" fill="#333">
      <tspan fill="#0288d1" font-weight="bold">■ Glucides 4%</tspan> (2.7g, dont 1.3g sucres)  
      <tspan fill="#43a047" font-weight="bold">■ Prot. 7%</tspan> (4.4g)  
      <tspan fill="#f57f17" font-weight="bold">■ Lipides 88%</tspan> (24.0g, dont 2.4g sat.)
    </text>

    <!-- Badges -->
    <line x1="20" y1="185" x2="420" y2="185" stroke="#eeeeee" stroke-width="1"/>
    
      <rect x="20" y="205" width="130" height="26" rx="6" fill="#d32f2f" opacity="0.15"/>
      <text x="85" y="222" font-size="11" font-weight="bold" fill="#d32f2f" text-anchor="middle">⚠️ Fort en sel</text>
    
      <rect x="160" y="205" width="130" height="26" rx="6" fill="#c2185b" opacity="0.15"/>
      <text x="225" y="222" font-size="11" font-weight="bold" fill="#c2185b" text-anchor="middle">🏭 Ultra-transformé</text>
    
  </svg>